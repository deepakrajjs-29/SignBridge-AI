<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="SignBridge AI — Real-time Indian Sign Language (ISL) bidirectional translation platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <title>SignBridge AI — Indian Sign Language Translation</title>
    <script>
      (function() {
        try {
          var h = localStorage.getItem("sb_theme_hue");
          if (h) document.documentElement.style.setProperty("--hue", h);
          var t = localStorage.getItem("sb_theme") || "dark";
          var isDark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-page-bg dark:bg-midnight-dark text-midnight dark:text-slate-100 antialiased selection:bg-seafoam selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
