name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend/ ; black --check backend/
      - run: mypy backend/ || true # type-debt
      - run: pytest tests/ -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm --prefix frontend ci || npm --prefix frontend install
      - run: npm --prefix frontend test
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm --prefix frontend run build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -rEn "(sk-|AKIA|-----BEGIN (RSA )?PRIVATE KEY)" --exclude-dir=node_modules --exclude-dir=.git . && exit 1 || echo "secrets-scan clean"
  pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/signbridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r backend/requirements.txt
      - run: pytest tests/test_db_m1.py tests/test_retention.py tests/test_backup.py
