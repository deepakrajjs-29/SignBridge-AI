name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend/ ; black --check backend/
      - run: mypy backend/ || true
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm --prefix frontend ci || npm --prefix frontend install
      - run: npm --prefix frontend test -- --watchAll=false || true
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -rEn "(sk-|AKIA|-----BEGIN (RSA )?PRIVATE KEY)" --exclude-dir=node_modules --exclude-dir=.git . && exit 1 || echo "secrets-scan clean"
