services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: signbridge
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: signbridge
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signbridge"]
      interval: 5s
      retries: 10
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://signbridge:change-me@db:5432/signbridge
      MODEL_VERSION: SBAI-MDL-ISL-1.0.0
      SEQ_LEN: "45"
      FEAT_DIM: "189"
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports: ["3000:80"]
    depends_on: [backend]
